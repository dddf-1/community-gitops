apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-backend
  labels:
    app: community
    tier: backend
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}

  selector:
    matchLabels:
      app: community
      tier: backend

  template:
    metadata:
      labels:
        app: community
        tier: backend

    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}

      containers:
        - name: community-backend

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: community-backend-config

            - secretRef:
                name: {{ .Values.existingSecret.name }}

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2

          resources:
{{ toYaml .Values.resources | indent 12 }}
